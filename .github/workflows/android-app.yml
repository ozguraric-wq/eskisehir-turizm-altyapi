name: Build Android app
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'mobile/**'
      - 'scripts/build-mobile.mjs'
      - 'scripts/prepare-app-assets.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - '.github/workflows/android-app.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-app
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Build mobile content
        run: npm run build:mobile
        env:
          NEXT_PUBLIC_AI_BASE_URL: ${{ vars.ETAHB_AI_BASE_URL }}
      - name: Sync Android app
        run: npx cap sync android
      - name: Build installable Android test package
        working-directory: mobile/android
        run: bash gradlew assembleDebug --no-daemon
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: Eskisehir-Cebimde-Android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
